                {
                    "@type": "Question",
                    "name": "What is Sanatani Bandhan?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Sanatani Bandhan is an offline-first ERP and community app for Sanatana Dharma institutions — temples, goshalas, ashrams, gurukuls, trusts and 13 more organisation types (17 in all). It runs an institution's treasury, devotees, sevas, festivals and community in one workspace, with a tamper-evident audit history and a public Transparency Board."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Who can use it — what kinds of institutions?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "17 organisation types: Mandir, Goshala, Ashram, Gurukul, Vidyalaya, Sangha, Samaj, Satsang, Yoga, Trust, Dharmada Trust, Akshaya Patra, Tirth, Kashi Kshetra, Mahotsav Samiti, Purohit Sabha, and a personal Purohit workspace for independent priests. Individual devotees use the Solo Sanatani personal app."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What does Sanatani Bandhan cost?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Seva is free forever (₹0). Standard is ₹499 / ৳700 / $6 per month or ₹4,999 / ৳7,000 / $60 per year. Premium is ₹1,999 / ৳2,800 / $24 per month or ₹19,999 / ৳28,000 / $240 per year. Purohit/Jyotishi Pro is ₹199 / ৳280 / $2.50 per month. Annual billing gives two months free."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Is there a free plan?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. The Seva plan is free forever — not a trial — and covers an institution with up to 100 devotees, 2 team seats and 1 branch, including treasury, devotee records and the audit history."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Does it work without internet?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. Sanatani Bandhan is offline-first: registers, treasury entries and seva bookings work with zero connectivity — for example in a temple courtyard with no signal — and sync securely to the cloud when the network returns."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What devices does it run on?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Any device with a modern browser, and it installs as an app (PWA) on Android, iPhone and desktop. It is floor-proof: fully functional on Android 8+, 2GB RAM phones with 360px-wide screens, and premium on flagship devices."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Which languages does it support?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "10 languages: English, Hindi, Bengali, Sanskrit, Tamil, Telugu, Marathi, Gujarati, Kannada and Malayalam. Sacred terms are never translated."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What does it replace in our daily work?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "The paper registers and spreadsheets an institution keeps for donations and expenses, devotee lists, puja bookings, festival budgets and stock — plus the WhatsApp groups used to coordinate them. Each organisation type gets its own flagship suite (for example Goshala One for goshalas, Utsav One for festivals) instead of one generic tool."
                    }
                },
                {
                    "@type": "Question",
                    "name": "How does it keep donation money safe and auditable?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Every treasury action is written to a hash-chained, append-only audit history: each record is sealed with a SHA-256 hash linked to the previous record, so no one — not even a trustee — can quietly edit or delete history afterwards. Roles decide who can record, approve or view money, and a trustee can verify the whole chain in one tap."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What is the Transparency Board?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "A public page for the institution where trustees deliberately publish monthly accounts: total income, total expenses, the category breakdown and how many donors gave. Devotees can see exactly where money went. Individual donor names and amounts never appear, and nothing is public until a trustee publishes that month."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Does every donation get a receipt?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes — every donation attached to a donor receives a receipt number at the moment it is recorded (80G receipts are supported). Donations that are genuinely anonymous, like loose hundi cash, are recorded honestly as anonymous rather than given a fabricated receipt."
                    }
                },
                {
                    "@type": "Question",
                    "name": "How do we move from paper registers?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Create a free workspace for your institution, invite your team with their roles (trustee, accountant, priest, sevadar), and start recording devotees and donations — sample data lets you practise first, and you can keep paper running alongside until you are confident. Onboarding help is free on WhatsApp (+8801608533529) and email (Sanatanibandhan@gmail.com)."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What is the Universal Sanatani ID?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "One identity for every devotee. Instead of registering separately at each temple, a person has a single Sanatani ID that connects them to every institution they serve or visit, and to their own bookings, seva history and personal app."
                    }
                },
                {
                    "@type": "Question",
                    "name": "I am a purohit or jyotishi — how do I earn through it?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "You get a personal workspace and can be booked by devotees through Seva Bazar, the built-in marketplace. Community listing is free (15% commission on paid bookings); the Pro plan (₹199 / ৳280 / $2.50 per month) adds a verified badge, unlimited paid sevas and lower commission — 8% on Rail-1 and 12% on Rail-2."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What is Seva Bazar and Sangam?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Seva Bazar is the marketplace where devotees discover and book verified purohits, jyotishis and other seva providers, with dakshina handled through the platform. Sangam is the community layer — feed, circles, events and stories — where institutions and devotees stay connected between festivals."
                    }
                },
                {
                    "@type": "Question",
                    "name": "Is our institution's data private?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Yes. Each institution's workspace is isolated and role-based: only its own members see its records, and only in the desks their role allows. The public Transparency Board shows only the monthly aggregates a trustee chose to publish — never donor names, devotee records or internal history."
                    }
                },
                {
                    "@type": "Question",
                    "name": "What is Solo Sanatani?",
                    "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "The personal side of the platform for individual devotees: your Sanatani ID, sadhana and festival rhythm, puja bookings, community (Sangam), a personal wallet ledger, and safety features — one app for a devotee family's whole Sanatani life."
                    }

                        "@type": "Answer",

                    }
