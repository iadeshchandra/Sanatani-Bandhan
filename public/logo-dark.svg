<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow-dark" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f59e0b" flood-opacity="0.35" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#1c1917" />
  <circle cx="256" cy="256" r="210" fill="url(#grad-dark)" opacity="0.15" />
  <circle cx="256" cy="256" r="180" fill="url(#grad-dark)" filter="url(#shadow-dark)" />
  <!-- Sacred Om Vector -->
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Sanskrit Text', 'Arial', sans-serif" font-size="210" font-weight="900" text-anchor="middle" fill="#ffffff">ॐ</text>
  <!-- Kalash motif -->
  <path d="M 236 100 Q 256 70 276 100 Z" fill="#fef08a" />
</svg>
