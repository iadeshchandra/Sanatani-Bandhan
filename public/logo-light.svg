<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ea580c" flood-opacity="0.25" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="#ffffff" />
  <circle cx="256" cy="256" r="210" fill="url(#grad-light)" opacity="0.1" />
  <circle cx="256" cy="256" r="180" fill="url(#grad-light)" filter="url(#shadow)" />
  <!-- Sacred Om Vector -->
  <text x="256" y="325" font-family="'Noto Sans Devanagari', 'Sanskrit Text', 'Arial', sans-serif" font-size="210" font-weight="900" text-anchor="middle" fill="#ffffff">ॐ</text>
  <!-- Kalash / Shikhar motif -->
  <path d="M 236 100 Q 256 70 276 100 Z" fill="#fef08a" />
</svg>
