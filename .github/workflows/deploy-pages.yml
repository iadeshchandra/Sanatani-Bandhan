name: Deploy to GitHub Pages (free)

# Zero-cost production deploy. Builds the Vite app and publishes it to
# https://iadeshchandra.github.io/Sanatani-Bandhan/
# No secrets, no accounts, no build minutes beyond GitHub's free quota.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit

      - name: Build (GitHub Pages base path)
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
