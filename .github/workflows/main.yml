name: Sanatani Portal CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Serialize deploys: chunk pushes used to start racing workflow runs whose
# firestore:rules deploys collided at the rules-release step (HTTP 409
# 'release already exists'), killing the job before Hosting deployed.
# One deploy at a time; a running deploy is never cancelled mid-flight.
concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build_and_deploy:
    name: Build Web & Mobile APK, Deploy to Firebase
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          # NOTE: no 'cache' here — the repo has no package-lock.json (uses bun.lock)

      # ===== APK STEPS DISABLED — delete the '# ' at line starts to re-enable =====
      # - name: ☕ Setup Java 17 (Required for Android Gradle)
      #   uses: actions/setup-java@v4
      #   with:
      #     distribution: 'temurin'
      #     java-version: '17'
      #     cache: 'gradle'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗️ Build React Vite App
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
          CRITICAL_UPDATE: 'true'

      # - name: 🔄 Sync Capacitor Android
      #   run: npx cap sync android

      # - name: 📱 Build Debug APK via Gradle
      #   run: |
      #     cd android
      #     chmod +x gradlew
      #     ./gradlew assembleDebug

      # - name: 📦 Upload APK Artifact
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: Sanatani-Bandhan-Debug
      #     path: android/app/build/outputs/apk/debug/app-debug.apk
      # ===== END DISABLED APK STEPS =====

      - name: 🔥 Deploy Firestore Security Rules
        run: |
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
          ok=0
          for i in 1 2 3; do
            if GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json" npx -y firebase-tools@latest deploy --only firestore:rules --project shda-6245c --non-interactive; then
              ok=1
              break
            fi
            echo "Rules deploy attempt $i failed; waiting 60s before retry..."
            sleep 60
          done
          rm -f "$RUNNER_TEMP/sa.json"
          if [ "$ok" != "1" ]; then
            echo "Rules deploy failed after 3 attempts."
            exit 1
          fi

      # NOTE: Cloud Functions deploy step intentionally OMITTED.
      # Google removed function deploys from the free Spark plan (requires a
      # billing account). The app is fully serverless: Gemini calls Google
      # directly from the browser, QR pairing uses Firestore token docs, and
      # PIN has a local fallback. The functions/ directory stays in the repo
      # for a future Blaze migration.

      - name: 🚀 Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: shda-6245c
